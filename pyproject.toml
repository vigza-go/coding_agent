[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layered-context-agent"
version = "0.1.0"
description = "LangChain coding agent with layered context compaction and reversible file mutations"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.3.12",
  "langchain>=1.3.15",
  "langchain-anthropic>=1.5.6",
  "langgraph>=1.2.11",
  "langgraph-checkpoint-mysql[pymysql]>=3.0.0",
  "pymysql>=1.1.2",
  "rich>=14.0.0",
  "sqlalchemy>=2.0.43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
coding-agent = "coding_agent.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

